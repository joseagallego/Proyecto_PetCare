<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet-Care | Registrarse</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="eval-bar" aria-label="Navegación rápida del prototipo">
        <span>📂 Proyecto Pet-Care | Navegación por Archivos HTML</span>
        <a href="index.html">Login</a>
        <a href="registro.html" class="current">Registro</a>
        <a href="registro-mascota.html">Mascota</a>
        <a href="recuperar.html">Recuperar</a>
        <a href="home.html">Home</a>
        <a href="alimento.html">Alimento</a>
        <a href="transporte.html">Transporte</a>
        <a href="calendario.html">Calendario</a>
        <a href="estado-registro.html">Estado 1</a><a href="estado-historial.html">Estado 2</a><a href="estado-clave.html">Estado 3</a>
    </nav>

    <main class="android-frame">
        <div class="auth-container">
            <!-- Grupo Superior: Logo Oficial + Subtítulo -->
            <div class="auth-top-group">
                <!-- ESPACIO PARA LOGO OFICIAL: img/logo-petcare.png -->
                <div class="logo-header-slot">
                    <img src="img/logo-petcare.png" alt="Logo Pet-Care" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                    <div class="img-placeholder-label" style="display:none;">
                        🏷️ Logo en:<br><strong>img/logo-petcare.png</strong>
                    </div>
                </div>
                <p class="auth-subtitle">Registrarse</p>
            </div>

            <!-- Escena Central: Imagen de fondo envolviendo todo el formulario -->
            <div class="scene-wrapper" style="min-height: 440px;">
                <!-- ESPACIO PARA IMAGEN DE FONDO: img/ilustracion-registro.png -->
                <div class="repo-image-slot">
                    <img src="img/ilustracion-registro.png" alt="Ilustración registro Pet-Care" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                    <div class="img-placeholder-label" style="display:none;">
                        🖼️ Ilustración fondo:<br><strong>img/ilustracion-registro.png</strong>
                    </div>
                </div>

                <form class="overlay-form" style="margin-top: 32px; gap: 11px;" action="registro-mascota.html" method="get">
                    <input type="text" class="figma-input" placeholder="Nombre completo" required>
                    <input type="email" class="figma-input" placeholder="Correo electrónico" required>
                    <input type="tel" class="figma-input" placeholder="Teléfono de contacto" required>
                    <input type="password" class="figma-input" placeholder="Crear contraseña" required>
                    <div>
                        <button type="submit" class="btn-figma-pill">Registrarse</button>
                    </div>
                </form>
            </div>

            <!-- Botón inferior con imagen de Home para volver al Login -->
            <div class="auth-links">
                <!-- ESPACIO PARA ICONO HOME: img/icono-home.png -->
                <a href="index.html" class="home-icon-btn" title="Volver al Login">
                    <img src="img/icono-home.png" alt="Inicio" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                    <span style="display:none; font-size:0.62rem; color:#5C4D26; font-weight:700;">home.png</span>
                </a>
            </div>
        </div>
    </main>
</body>
</html>
