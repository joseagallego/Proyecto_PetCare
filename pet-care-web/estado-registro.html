<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet-Care | Registro Exitoso</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="eval-bar" aria-label="Navegación rápida del prototipo">
        <span>📂 Proyecto Pet-Care | Navegación por Archivos HTML</span>
        <a href="index.html">Login</a>
        <a href="registro.html">Registro</a>
        <a href="registro-mascota.html">Mascota</a>
        <a href="recuperar.html">Recuperar</a>
        <a href="home.html">Home</a>
        <a href="alimento.html">Alimento</a>
        <a href="transporte.html">Transporte</a>
        <a href="calendario.html">Calendario</a>
        <a href="estado-registro.html" class="current">Estado 1</a>
        <a href="estado-historial.html">Estado 2</a>
        <a href="estado-clave.html">Estado 3</a>
    </nav>

    <main class="android-frame">
        <header class="figma-top-banner">
            <!-- ESPACIO PARA LOGO OFICIAL: img/logo-petcare.png -->
            <div class="figma-oval-logo">
                <img src="img/logo-petcare.png" alt="Logo Pet-Care" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                <span style="display:none; font-size:0.62rem; color:#2E7D8B; font-weight:700;">logo-petcare.png</span>
            </div>

            <div class="figma-user-area">
                <div class="figma-user-links">
                    <span>Hola , Jose</span>
                </div>
                <!-- ESPACIO PARA AVATAR DE JOSE: img/avatar-jose.png -->
                <div class="figma-avatar-box">
                    <img src="img/avatar-jose.png" alt="Avatar Jose" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                    <span style="display:none; font-size:0.55rem; color:#555;">avatar<br>jose.png</span>
                </div>
            </div>
        </header>

        <section class="figma-status-body">
            <p class="figma-status-msg">Tu Registro a sido Exitoso</p>
            <a href="home.html" class="figma-status-link">Ir a pagina de Servicios</a>
        </section>

        <footer class="figma-bottom-home">
            <!-- ESPACIO PARA ICONO HOME: img/icono-home.png -->
            <a href="home.html" class="home-icon-btn" title="Volver al Home">
                <img src="img/icono-home.png" alt="Inicio" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                <span style="display:none; font-size:0.62rem; color:#5C4D26; font-weight:700;">home.png</span>
            </a>
        </footer>
    </main>
</body>
</html>
