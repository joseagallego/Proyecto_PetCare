<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet-Care | Registro Mascota</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="eval-bar" aria-label="Navegación rápida del prototipo">
        <span>📂 Proyecto Pet-Care | Navegación por Archivos HTML</span>
        <a href="index.html">Login</a>
        <a href="registro.html">Registro</a>
        <a href="registro-mascota.html" class="current">Mascota</a>
        <a href="recuperar.html">Recuperar</a>
        <a href="home.html">Home</a>
        <a href="alimento.html">Alimento</a>
        <a href="transporte.html">Transporte</a>
        <a href="calendario.html">Calendario</a>
        <a href="estado-registro.html">Estado</a>
    </nav>

    <main class="android-frame">
        <div class="auth-container">
            <!-- Grupo Superior: Logo Oficial + Subtítulo -->
            <div class="auth-top-group">
                <!-- ESPACIO PARA LOGO OFICIAL: img/logo-petcare.png -->
                <div class="logo-header-slot">
                    <img src="img/logo-petcare.png" alt="Logo Pet-Care" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                    <div class="img-placeholder-label" style="display:none;">
                        🏷️ Logo en:<br><strong>img/logo-petcare.png</strong>
                    </div>
                </div>
                <p class="auth-subtitle">Cuéntanos sobre tu mascota</p>
            </div>

            <!-- Formulario con Ilustración de Fondo -->
            <form style="width: 100%; display: flex; flex-direction: column; align-items: center;" action="estado-registro.html" method="get">
                <div class="scene-wrapper" style="min-height: 360px;">
                    <!-- ESPACIO PARA IMAGEN DE FONDO: img/ilustracion-mascota.png -->
                    <div class="repo-image-slot">
                        <img src="img/ilustracion-mascota.png" alt="Ilustración mascota Pet-Care" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                        <div class="img-placeholder-label" style="display:none;">
                            🖼️ Ilustración fondo:<br><strong>img/ilustracion-mascota.png</strong>
                        </div>
                    </div>

                    <div class="pet-figma-columns">
                        <!-- Columna Izquierda: Nombre, Tipo de Mascota, Edad -->
                        <div class="pet-col-stack">
                            <input type="text" class="figma-input" placeholder="Nombre" required>
                            <input type="text" class="figma-input" placeholder="Tipo de Mascota" required>
                            <input type="text" class="figma-input" placeholder="Edad" required>
                        </div>

                        <!-- Columna Derecha: Raza y Breve Historia Clínica -->
                        <div class="pet-col-stack">
                            <input type="text" class="figma-input" placeholder="Raza" required>
                            <textarea class="figma-textarea" placeholder="Breve Historia Clínica" required></textarea>
                        </div>
                    </div>
                </div>

                <!-- Botón Guardar debajo de la ilustración -->
                <button type="submit" class="btn-figma-pill" style="margin-top: 22px;">Guardar</button>
            </form>

            <!-- Botón inferior con imagen de Home para volver al Login -->
            <div class="auth-links">
                <!-- ESPACIO PARA ICONO HOME: img/icono-home.png -->
                <a href="index.html" class="home-icon-btn" title="Volver al Login">
                    <img src="img/icono-home.png" alt="Inicio" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                    <span style="display:none; font-size:0.62rem; color:#5C4D26; font-weight:700;">home.png</span>
                </a>
            </div>
        </div>
    </main>
</body>
</html>
